name: probe
on: workflow_dispatch

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: pull one Victorian quarter
        run: |
          curl -sSL --max-time 120 -o vic.xlsx \
            "https://www.dffh.vic.gov.au/tables-rental-report-september-quarter-2025-excel" \
            -w '%{http_code} %{size_download} %{content_type}\n'
          file vic.xlsx
      - uses: actions/upload-artifact@v4
        with:
          name: vic
          path: vic.xlsx
