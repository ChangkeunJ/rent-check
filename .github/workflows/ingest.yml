name: ingest

on:
  schedule:
    # New South Wales posts the month's lodgements in the first fortnight of the
    # next month; Queensland posts a quarter about three weeks after it ends.
    - cron: '0 20 14 * *'
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: psql "$DATABASE_URL" -f schema.sql
      - run: npm run build
      - run: node dist/src/nsw.js
      - run: node dist/src/qld.js
      - run: node dist/src/summary.js
      - name: commit the month
        run: |
          git config user.name ChangkeunJ
          git config user.email reiot92@gmail.com
          git add data
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "$(date -u +%Y-%m-%d) rents"
          git push
